name: d_rocket_lints
description: Static analysis rules for d_rocket that detect untranslated LINQ closures and N+1 navigation fetches before they reach production.
version: 2.2.2

repository: https://github.com/torogoz-tech/d_rocket_lints
homepage: https://github.com/torogoz-tech/d_rocket_lints
issue_tracker: https://github.com/torogoz-tech/d_rocket_lints/issues
documentation: https://github.com/torogoz-tech/d_rocket_lints/blob/main/README.md

topics:
  - lints
  - analyzer-plugin
  - d-rocket
  - static-analysis
  - dev-tool

environment:
  # 3.9+ required by analysis_server_plugin 0.3.x.
  sdk: ^3.9.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

# 2.0.0 — switched from `custom_lint_builder`
# (archived 2026-03-24, max analyzer 8.0.0)
# to the official `analysis_server_plugin`
# (maintained by tools.dart.dev, supports
# analyzer 9.0.0+). Bumps analyzer ^8.4.0
# → ^9.0.0. The `dart analyze` command
# auto-discovers this plugin via the top-level
# `plugins: {d_rocket_lints: ^2.2.2}`
# section in the consumer's
# `analysis_options.yaml`.
dependencies:
  d_rocket: ^2.2.2
  # 2.2.2 — pinned Analyzer 13.0.0 in lockstep with
  # analysis_server_plugin 0.3.15 and analyzer_plugin 0.14.9.
  analyzer: 13.0.0
  analyzer_plugin: 0.14.9
  analysis_server_plugin: 0.3.15

dev_dependencies:
  # 2.2.2 — official testing utilities for
  # analysis_server_plugin rules. ^0.2.6 pairs
  # with Analyzer 13.0.0.
  analyzer_testing: ^0.2.6
  # 2.0.0 — `AnalysisRuleTest` extends
  # `PubPackageResolutionTest`, which uses
  # the reflective loader to discover
  # `test_*` methods on the test class.
  test_reflective_loader: ^0.2.0
  lints: ^6.0.0
  test: ^1.31.2
